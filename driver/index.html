<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snowy Skips — Open Docket</title>
<style>
  :root{--mc:#0a2240;--or:#e8611a;--tl:#1D9E75}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.06);text-align:center}
  .logo{width:64px;height:64px;background:var(--mc);border-radius:14px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px}
  h1{font-size:20px;color:var(--mc);margin-bottom:6px}
  p{font-size:13px;color:#666;margin-bottom:22px;line-height:1.5}
  .btn{display:block;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;margin-bottom:10px;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn-primary{background:var(--mc);color:#fff}
  .btn-orange{background:var(--or);color:#fff}
  .hint{font-size:11px;color:#999;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SS</div>
    <h1>Snowy Skips</h1>
    <p>Pick which app to open.</p>
    <a class="btn btn-orange" href="/driver/">Driver app (mobile)</a>
    <a class="btn btn-primary" href="/office/">Office dashboard</a>
    <div class="hint">McKimm Civil Pty Ltd · Snowy Mountains, NSW</div>
  </div>
</body>
</html>
